name: Sync Amazon prices
on:
  schedule:
    - cron: '17 */6 * * *'   # every 6 h at :17 (off-minute, avoids API peak)
  workflow_dispatch:         # manual trigger from the Actions tab
permissions:
  contents: write
concurrency:
  group: price-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch prices from Amazon
        run: node scripts/fetch-prices.js
      - name: Commit price changes
        run: |
          git config user.name "neokesan-price-bot"
          git config user.email "price-bot@neokesan.com"
          git add assets/live-prices.js
          if git diff --cached --quiet; then
            echo "No price changes"
          else
            git commit -m "Sync product prices from Amazon"
            git push
          fi
